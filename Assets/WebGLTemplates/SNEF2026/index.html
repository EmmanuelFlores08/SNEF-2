<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

  <!-- Responsive + soporte para áreas seguras en iPhone -->
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  >

  <!-- Mejor comportamiento al guardar como app en iOS/Android -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <title>Unity Web Player | {{{ PRODUCT_NAME }}}</title>

  <style>
    :root {
      --app-height: 100dvh;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #141414;
    }

    body {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: var(--app-height);
    }

    #unity-container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: var(--app-height);
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #141414;
    }

    #unity-canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
      margin: 0;
      padding: 0;
      border: 0;
      outline: 0;
      background: #141414;
    }

    /* Botón de pantalla completa */
    #fullscreen-button {
      position: fixed;
      right: max(18px, env(safe-area-inset-right));
      bottom: max(18px, env(safe-area-inset-bottom));
      z-index: 99999;
      width: 54px;
      height: 54px;
      padding: 0;
      border: 0;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.52);
      color: #ffffff;
      cursor: pointer;
      -webkit-backdrop-filter: blur(7px);
      backdrop-filter: blur(7px);
      transition: transform 0.15s ease, background 0.15s ease, opacity 0.15s ease;
      touch-action: manipulation;
    }

    #fullscreen-button:hover {
      background: rgba(0, 0, 0, 0.72);
      transform: scale(1.05);
    }

    #fullscreen-button:active {
      transform: scale(0.94);
    }

    #fullscreen-button svg {
      width: 32px;
      height: 32px;
      display: block;
      pointer-events: none;
    }

    #fullscreen-button .icon-exit {
      display: none;
    }

    body.is-fullscreen #fullscreen-button .icon-enter {
      display: none;
    }

    body.is-fullscreen #fullscreen-button .icon-exit {
      display: block;
    }

    /* Fallback visual para Safari/iPhone sin Fullscreen API. */
    html.visual-fullscreen,
    html.visual-fullscreen body,
    body.visual-fullscreen,
    body.visual-fullscreen #unity-container {
      width: 100vw !important;
      height: var(--app-height) !important;
      margin: 0 !important;
      padding: 0 !important;
      overflow: hidden !important;
    }

    @media (pointer: coarse), (max-width: 768px) {
      #fullscreen-button {
        width: 58px;
        height: 58px;
        right: max(14px, env(safe-area-inset-right));
        bottom: max(14px, env(safe-area-inset-bottom));
      }

      #fullscreen-button svg {
        width: 34px;
        height: 34px;
      }
    }

    /* Aviso de orientación para celulares en vertical */
    #orientation-warning {
      position: fixed;
      inset: 0;
      z-index: 1000000;
      display: none;
      align-items: center;
      justify-content: center;
      padding:
        max(24px, env(safe-area-inset-top))
        max(24px, env(safe-area-inset-right))
        max(24px, env(safe-area-inset-bottom))
        max(24px, env(safe-area-inset-left));
      background: rgba(10, 10, 10, 0.96);
      color: #ffffff;
      text-align: center;
      font-family: Arial, Helvetica, sans-serif;
    }

    #orientation-warning .orientation-content {
      width: min(420px, 88vw);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    #orientation-warning .phone-rotate-icon {
      width: 92px;
      height: 92px;
      animation: rotatePhoneHint 1.8s ease-in-out infinite;
      transform-origin: center;
    }

    #orientation-warning h2 {
      margin: 0;
      font-size: clamp(24px, 7vw, 34px);
      line-height: 1.1;
      font-weight: 700;
    }

    #orientation-warning p {
      margin: 0;
      max-width: 360px;
      font-size: clamp(15px, 4.3vw, 18px);
      line-height: 1.45;
      color: rgba(255, 255, 255, 0.8);
    }

    @keyframes rotatePhoneHint {
      0%, 25% { transform: rotate(0deg); }
      55%, 85% { transform: rotate(90deg); }
      100% { transform: rotate(0deg); }
    }

    @media (orientation: portrait) and (pointer: coarse) and (max-width: 900px) {
      #orientation-warning {
        display: flex;
      }

      #fullscreen-button {
        visibility: hidden;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #orientation-warning .phone-rotate-icon {
        animation: none;
        transform: rotate(90deg);
      }
    }
  </style>
</head>

<body>
  <div id="orientation-warning" role="dialog" aria-modal="true" aria-label="Gira tu dispositivo">
    <div class="orientation-content">
      <svg class="phone-rotate-icon" viewBox="0 0 120 120" aria-hidden="true">
        <rect
          x="38"
          y="15"
          width="44"
          height="82"
          rx="8"
          ry="8"
          fill="none"
          stroke="currentColor"
          stroke-width="6"
        />
        <line
          x1="51"
          y1="26"
          x2="69"
          y2="26"
          stroke="currentColor"
          stroke-width="5"
          stroke-linecap="round"
        />
        <circle cx="60" cy="86" r="3.5" fill="currentColor" />
        <path
          d="M88 35c12 6 19 18 18 31"
          fill="none"
          stroke="currentColor"
          stroke-width="6"
          stroke-linecap="round"
        />
        <path
          d="M99 61l7 8 8-7"
          fill="none"
          stroke="currentColor"
          stroke-width="6"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>

      <h2>Gira tu dispositivo</h2>
      <p>Para una mejor experiencia, utiliza el cine virtual en posición horizontal.</p>
    </div>
  </div>

  <div id="unity-container">
    <canvas
      id="unity-canvas"
      width={{{ WIDTH }}}
      height={{{ HEIGHT }}}
      tabindex="-1"
    ></canvas>
  </div>

  <button
    id="fullscreen-button"
    type="button"
    aria-label="Pantalla completa"
    title="Pantalla completa"
  >
    <svg class="icon-enter" viewBox="0 0 24 24" aria-hidden="true">
      <path
        fill="currentColor"
        d="M4 4h6v2H6v4H4V4zm10 0h6v6h-2V6h-4V4zM4 14h2v4h4v2H4v-6zm14 0h2v6h-6v-2h4v-4z"
      />
    </svg>

    <svg class="icon-exit" viewBox="0 0 24 24" aria-hidden="true">
      <path
        fill="currentColor"
        d="M8 4h2v6H4V8h4V4zm6 0h2v4h4v2h-6V4zM4 14h6v6H8v-4H4v-2zm10 0h6v2h-4v4h-2v-6z"
      />
    </svg>
  </button>

  <script src="Build/{{{ LOADER_FILENAME }}}"></script>

  <script>
    const canvas = document.querySelector("#unity-canvas");
    const fullscreenButton = document.querySelector("#fullscreen-button");

    let unityInstance = null;
    let visualFullscreen = false;

    function updateViewportHeight() {
      const viewportHeight = window.visualViewport
        ? window.visualViewport.height
        : window.innerHeight;

      document.documentElement.style.setProperty(
        "--app-height",
        viewportHeight + "px"
      );
    }

    updateViewportHeight();
    window.addEventListener("resize", updateViewportHeight);

    window.addEventListener("orientationchange", function () {
      setTimeout(updateViewportHeight, 100);
      setTimeout(updateViewportHeight, 400);
    });

    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", updateViewportHeight);
    }

    function getFullscreenElement() {
      return document.fullscreenElement || document.webkitFullscreenElement || null;
    }

    function updateFullscreenButton(active) {
      document.body.classList.toggle("is-fullscreen", active);

      fullscreenButton.setAttribute(
        "aria-label",
        active ? "Salir de pantalla completa" : "Pantalla completa"
      );

      fullscreenButton.title = active
        ? "Salir de pantalla completa"
        : "Pantalla completa";

      updateViewportHeight();
      window.dispatchEvent(new Event("resize"));

      setTimeout(function () {
        updateViewportHeight();
        window.dispatchEvent(new Event("resize"));
      }, 150);
    }

    function enableVisualFullscreen() {
      visualFullscreen = true;
      document.documentElement.classList.add("visual-fullscreen");
      document.body.classList.add("visual-fullscreen");
      updateFullscreenButton(true);

      setTimeout(function () {
        updateViewportHeight();
        window.scrollTo(0, 1);
      }, 50);
    }

    function disableVisualFullscreen() {
      visualFullscreen = false;
      document.documentElement.classList.remove("visual-fullscreen");
      document.body.classList.remove("visual-fullscreen");
      updateFullscreenButton(false);
    }

    async function enterFullscreen() {
      const target = document.documentElement;

      try {
        if (target.requestFullscreen) {
          try {
            await target.requestFullscreen({ navigationUI: "hide" });
          } catch (error) {
            await target.requestFullscreen();
          }
          return;
        }

        if (target.webkitRequestFullscreen) {
          target.webkitRequestFullscreen();
          return;
        }
      } catch (error) {
        console.warn("No fue posible activar fullscreen nativo:", error);
      }

      enableVisualFullscreen();
    }

    async function exitFullscreen() {
      try {
        if (document.exitFullscreen && document.fullscreenElement) {
          await document.exitFullscreen();
          return;
        }

        if (document.webkitExitFullscreen && document.webkitFullscreenElement) {
          document.webkitExitFullscreen();
          return;
        }
      } catch (error) {
        console.warn("No fue posible salir de fullscreen nativo:", error);
      }

      if (visualFullscreen) {
        disableVisualFullscreen();
      }
    }

    async function toggleFullscreen() {
      if (getFullscreenElement()) {
        await exitFullscreen();
        return;
      }

      if (visualFullscreen) {
        disableVisualFullscreen();
        return;
      }

      await enterFullscreen();

      setTimeout(function () {
        if (!getFullscreenElement() && !visualFullscreen) {
          enableVisualFullscreen();
        }
      }, 300);
    }

    fullscreenButton.addEventListener("click", toggleFullscreen);

    document.addEventListener("fullscreenchange", function () {
      updateFullscreenButton(!!document.fullscreenElement || visualFullscreen);
    });

    document.addEventListener("webkitfullscreenchange", function () {
      updateFullscreenButton(!!document.webkitFullscreenElement || visualFullscreen);
    });

    createUnityInstance(canvas, {
      arguments: [],
      dataUrl: "Build/{{{ DATA_FILENAME }}}",
      frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
      workerUrl: "Build/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
      codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
      symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}}
    })
    .then(function (instance) {
      unityInstance = instance;
      updateViewportHeight();
      window.dispatchEvent(new Event("resize"));
    })
    .catch(function (message) {
      alert(message);
    });
  </script>
</body>
</html>
